<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fullstack Lending &middot; Ascend</title>
<style>
  :root{--bg:#FAF9F6;--card:#FFF;--line:#E6E3DA;--ink:#1A1A16;--dim:#75716A;}
  @media (prefers-color-scheme:dark){:root{--bg:#100F0D;--card:#191815;--line:#2E2C26;
    --ink:#F2F0EA;--dim:#98948B;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .w{max-width:840px;margin:0 auto;padding:56px 20px 80px}
  header{margin-bottom:44px}
  h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
  header p{margin:3px 0 0;color:var(--dim);font-size:14px}
  h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
    color:var(--dim);margin:0 0 14px}
  section{margin-bottom:46px}
  .g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .c{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .c svg{display:block;width:100%;height:auto}
  .p{display:flex;gap:10px;margin-top:14px}
  .p div{flex:1}
  .p i{display:block;height:44px;border-radius:9px;border:1px solid var(--line)}
  .p span{display:block;margin-top:7px;font:11.5px ui-monospace,Menlo,monospace;color:var(--dim)}
  @media (max-width:560px){.w{padding:36px 14px 60px}.g{gap:10px}.p{gap:7px}}
</style>
</head>
